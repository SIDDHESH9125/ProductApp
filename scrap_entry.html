            "spacing": {
                    "worker_grid_gutter": "24px",
                    "touch_target_min": "56px",
                    "worker_margin": "16px",
                    "owner_grid_gutter": "12px",
                    "density_scale": "4px",

<style>
        /* Hide number input spinners for cleaner high-contrast look */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background min-h-screen relative font-body-operator text-on-surface overflow-hidden">
<!-- Simulated Background Dashboard (Blurred) -->
<div class="absolute inset-0 z-0 opacity-20 bg-cover bg-center grayscale" data-alt="A blurred, high-contrast industrial factory floor background featuring heavy machinery and metallic surfaces, conveying a rugged manufacturing environment typical of IoT sensor monitoring." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBhxR4OjijXKMvHQ58-Vo28wdcDja19kP0vf1d-6FDhZu4YA9wK5OW69IUJysDqzKNvEFyGhMhUmI_a8m8VniMh1sakeWb2Pxcn2t-M3yss2WM0LriYxbdFGlC38PURtPvwHCqnTin7unOekNggSFn5aOWbIqObFnQ9SgNR45Hw4w6QeWivlB-E0VpBdCuLbVk2kDentOpLWGBXvmYm1whbKcecxGLpggDBuHUOKNbbC6IBwYghrFgmnFYR2KEgsLUVtrRvYTYcl2M');">
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 bg-inverse-surface/80 flex items-center justify-center p-worker_margin backdrop-blur-sm">
<!-- Modal Card (Worker Theme: High Contrast, Thick Borders) -->
<main class="w-full max-w-lg bg-surface-container-lowest border-4 border-on-surface shadow-[8px_8px_0px_0px_rgba(29,27,32,1)] flex flex-col gap-worker_grid_gutter p-worker_margin md:p-6 relative">
<!-- Warning Accent Tab -->
<div class="absolute top-0 left-0 w-full h-2 bg-error"></div>
<!-- Header Section -->
<header class="flex flex-col gap-2 mt-2">
<h1 class="font-h1-executive text-h1-executive text-error flex items-center gap-3 uppercase tracking-tight">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">warning</span>
                    Mandatory Scrap Entry
                </h1>
<p class="font-body-operator text-body-operator text-on-surface-variant border-l-4 border-error pl-3">
                    You must enter scrap quantity to finish your shift.
                </p>
</header>
<!-- Input Section (Fat-Finger Friendly) -->
<section class="flex flex-col gap-4 bg-surface p-4 border-2 border-outline-variant">
<label class="font-label-caps text-label-caps text-on-surface uppercase block text-center w-full" for="scrap-input">
                    Enter Defect/Scrap Part Quantity
                </label>
<div class="flex items-center justify-center gap-worker_margin">
<!-- Stepper Minus -->
<button aria-label="Decrease quantity" class="w-16 h-16 bg-surface-container-highest border-2 border-on-surface flex items-center justify-center active:bg-outline-variant transition-colors group">
<span class="material-symbols-outlined text-4xl text-on-surface group-active:scale-90 transition-transform">remove</span>
</button>
<!-- Large Number Input -->
<input class="w-32 h-24 border-4 border-on-surface text-center font-status-xl text-status-xl text-error bg-surface-container-lowest focus:outline-none focus:border-error focus:ring-0" id="scrap-input" min="0" type="number" value="0"/>
<!-- Stepper Plus -->
<button aria-label="Increase quantity" class="w-16 h-16 bg-surface-container-highest border-2 border-on-surface flex items-center justify-center active:bg-outline-variant transition-colors group">
<span class="material-symbols-outlined text-4xl text-on-surface group-active:scale-90 transition-transform">add</span>
</button>
</div>
</section>
<!-- Calculation Preview (Read-Only Plate) -->
<section class="bg-surface-container border-2 border-outline border-dashed p-4 flex flex-col gap-3">
<div class="flex justify-between items-center font-body-operator text-body-operator text-on-surface-variant">
<span>Total Produced:</span>
<span class="font-bold">450</span>
</div>
<div class="flex justify-between items-center font-body-operator text-body-operator text-error">
<span class="flex items-center gap-1"><span class="material-symbols-outlined text-sm">remove</span> Scrap:</span>
<span class="font-bold">0</span>
</div>
<hr class="border-t-2 border-outline-variant my-1"/>
<div class="flex justify-between items-center font-h1-executive text-h1-executive text-on-surface">
<span>Net OK Parts:</span>
<span>450</span>
</div>
</section>
<!-- Action Section -->
<footer class="mt-4">
    <a href="index.html"
<button class="w-full min-h-[56px] bg-on-surface text-surface-container-lowest border-2 border-on-surface font-label-caps text-label-caps uppercase tracking-widest flex items-center justify-center gap-3 active:translate-y-1 active:shadow-none transition-all shadow-[4px_4px_0px_0px_rgba(203,196,210,1)] hover:bg-inverse-surface">
<span class="material-symbols-outlined text-2xl">logout</span>
                    Submit &amp; End Shift
                </button></a>
</footer>
</main>
</div>
