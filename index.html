<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background min-h-screen flex items-center justify-center relative overflow-hidden font-body-operator text-body-operator">
<!-- Abstract Blueprint Background -->
<div class="absolute inset-0 w-full h-full opacity-10 pointer-events-none" data-alt="A subtle, highly detailed engineering blueprint pattern overlaying a solid light gray background. Thin, precise lines indicate mechanical parts and circuitry, rendered in faint graphite tones to create an industrial, technical texture without distracting from foreground elements. The aesthetic is clean, professional, and firmly rooted in modern industrial design principles." style="background-image: radial-gradient(circle at 50% 50%, #7a7582 1px, transparent 1px); background-size: 40px 40px;">
</div>
<!-- Login Plate -->
<main class="relative z-10 w-full max-w-md mx-worker_margin bg-surface border-[3px] border-on-surface rounded p-owner_margin flex flex-col items-center justify-center text-center shadow-[8px_8px_0px_0px_rgba(29,27,32,1)]">
<!-- Branding -->
<div class="mb-8 flex flex-col items-center">
<span class="material-symbols-outlined text-[64px] mb-4 text-primary" data-icon="precision_manufacturing" style="font-variation-settings: 'FILL' 1;">precision_manufacturing</span>
<h1 class="font-h1-worker text-h1-worker text-on-surface uppercase tracking-tighter">CNC Pulse</h1>
</div>
<!-- Instructions -->
<p class="font-body-operator text-body-operator text-on-surface-variant mb-8 px-4">
            Scan badge or sign in to start shift
        </p>
<!-- Actions -->
<div class="w-full flex flex-col gap-4">
<!-- RFID Scan Simulation area (Visual cue for worker theme) -->
<div class="w-full h-32 border-2 border-dashed border-outline-variant bg-surface-container rounded flex flex-col items-center justify-center mb-4">
<span class="material-symbols-outlined text-4xl text-outline mb-2" data-icon="badge">badge</span>
<span class="font-label-caps text-label-caps text-outline uppercase">Awaiting Scan...</span>
</div>
<!-- Divider -->
<div class="flex items-center w-full my-2">
<div class="flex-grow border-t-2 border-surface-variant"></div>
<span class="px-4 font-label-caps text-label-caps text-on-surface-variant uppercase">OR</span>
<div class="flex-grow border-t-2 border-surface-variant"></div>
</div>
<!-- Google Sign In Button -->
<div class="flex flex-col gap-4 w-full">
<a class="w-full h-touch_target_min bg-primary text-on-primary flex items-center justify-center gap-3 rounded border-[3px] border-on-surface hover:opacity-90 transition-opacity duration-150" href="worker_dashboard.html">
<span class="material-symbols-outlined text-2xl" data-icon="engineering">engineering</span>
<span class="font-body-operator text-body-operator font-bold uppercase tracking-tight">Worker Sign In</span>
</a>
<a class="w-full h-touch_target_min bg-on-surface text-surface flex items-center justify-center gap-3 rounded border-[3px] border-on-surface hover:bg-surface hover:text-on-surface transition-colors duration-150" href="executive_dashboard.html">
<span class="material-symbols-outlined text-2xl" data-icon="admin_panel_settings">admin_panel_settings</span>
<span class="font-body-operator text-body-operator font-bold uppercase tracking-tight">Executive Sign In</span>
</a>
</div>
</div>
